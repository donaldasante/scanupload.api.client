# ASP.NET Core (.NET Framework)
# Build and test ASP.NET Core projects targeting the full .NET Framework.
# Add steps that publish symbols, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/dotnet-core

trigger:
  tags:
    include:
    - release.*

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: scanupload-api-client-variables

steps:
- checkout: self 
  fetchDepth: 0
- task: UseDotNet@2
  displayName: 'Install .NET SDK'
  inputs:
    packageType: 'sdk'
    version: '9.x'

- task: DotNetCoreCLI@2
  displayName: 'Restore packages'
  inputs:
    command: 'restore'
    projects: '$(project)'

- task: DotNetCoreCLI@2
  displayName: 'Build project'
  inputs:
    command: 'build'
    projects: '$(project)'
    arguments: '--configuration $(buildConfiguration) /p:GeneratePackageOnBuild=false'

- script: |
    git config --global user.email "azdo_ci@scanupload.net"
    git config --global user.name "Azure DevOps CI"
    git config --global http.postBuffer 524288000

    git remote add github https://$(GITHUB_PAT)@github.com/donaldasante/scanupload.api.client.git || true

    git push github HEAD:refs/heads/main
    git push github --tags
  displayName: Mirror repo to ScanUpload.Api.Client GitHub

# Extract version from the tag name (strip "release." prefix)
- script: |
    TAG_NAME=$BUILD_SOURCEBRANCHNAME
    VERSION=${TAG_NAME#release.}
    echo "##vso[task.setvariable variable=PackageVersion]$VERSION"
  displayName: 'Extract version from tag'
 
- task: DotNetCoreCLI@2
  displayName: 'Pack NuGet package'
  inputs:
    command: 'pack'
    packagesToPack: '$(project)'
    versioningScheme: 'off'
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory) /p:PackageVersion=$(PackageVersion)'

- task: PublishBuildArtifacts@1
  displayName: 'Publish NuGet package artifact'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'nuget-packages'
    publishLocation: 'Container'

- task: DotNetCoreCLI@2
  displayName: 'Push Nuget Package to public nuget feed'
  inputs:
    command: custom
    custom: nuget
    arguments: >
      push $(Build.ArtifactStagingDirectory)/*.nupkg
      -s https://api.nuget.org/v3/index.json
      -k $(NUGET_API_KEY)
